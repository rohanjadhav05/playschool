name: Create / Recreate Release Tag

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.4.0-qa)'
        required: true
        type: string
      create_release:
        description: 'Also create a GitHub Release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write   # needed to push tags and manage releases

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so tagging works reliably

      - name: Delete existing release (if present)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG exists — deleting"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          else
            echo "No existing release for $TAG"
          fi

      - name: Delete existing tag (if present)
        env:
          TAG: ${{ inputs.tag_name }}
        run: |
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG exists — deleting"
            git push origin ":refs/tags/$TAG"
          else
            echo "No existing tag $TAG"
          fi

      - name: Create tag on current branch HEAD
        env:
          TAG: ${{ inputs.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG from ${{ github.ref_name }}"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: ${{ inputs.create_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --target "${{ github.sha }}" \
            --generate-notes